# Merge into panel deployment AFTER review; no public host ports.
services:
  vpn-max:
    build: /opt/vpn-max/source
    env_file: /opt/vpn-max/.env
    volumes:
      - /opt/vpn-max/data:/data
      # Only when MAX_API_SOCKET is configured for the SSH egress relay:
      - /opt/vpn-max/relay:/relay:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    networks:
      - internal
